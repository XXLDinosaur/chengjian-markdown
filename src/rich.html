<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https: http:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>成简</title><link rel="stylesheet" href="style.css"></head>
<body class="rich-mode">
<header class="topbar"><div class="brand"><span class="brand-mark"><img src="../assets/app-icon.svg" alt="竹简"></span><div>成简 <span class="brand-en">轻松写，直接编辑</span></div></div><div class="file-heading"><span id="fileName" role="button" tabindex="0" title="双击修改文件名">未命名.md</span><div class="history-actions"><button data-command="undo" title="撤销 Ctrl+Z">↶ 撤销</button><button data-command="redo" title="重做 Ctrl+Y">↷ 重做</button></div><span id="saveState" class="badge">新文档</span></div><button id="floatBtn" title="顶置浮窗">▣ 浮窗</button><div class="file-actions"><label class="auto-label"><input type="checkbox" id="autoSave" checked>实时保存</label><button id="printBtn">打印</button><button id="newBtn">新建</button><button id="openBtn">打开文档</button><button id="saveAsBtn">另存为</button><button id="saveBtn" class="primary">保存 <kbd>Ctrl S</kbd></button></div></header>
<main class="rich-main">
<div class="toolbar rich-toolbar"><div class="format-actions"><button id="outlineBtn" aria-controls="documentOutline" aria-expanded="true">☷ 目录</button><span class="divider"></span><span class="divider"></span><select id="blockType" aria-label="文字样式"><option value="1">一级标题</option><option value="2">二级标题</option><option value="3">三级标题</option><option value="0" selected>正文</option></select><button data-command="bold" title="加粗 Ctrl+B"><b>B</b></button><button data-command="italic" title="斜体 Ctrl+I"><i>I</i></button><button data-command="strike" title="删除线"><s>S</s></button><button data-command="bullet" title="项目符号">• 项目符号</button><div class="split-tool"><button data-command="ordered" title="编号">编号</button><button id="numberMenuBtn" class="menu-arrow" aria-label="选择编号样式" aria-expanded="false">▾</button></div><button data-command="task" title="待办清单">☑ 待办</button><button data-command="quote" title="引用">❝</button><button data-command="code" title="代码块">&lt;/&gt;</button><div class="split-tool"><button id="highlightBtn">突出</button><button id="highlightMenuBtn" class="menu-arrow" aria-label="选择突出颜色" aria-expanded="false">▾</button></div><button id="brushBtn" title="单击格式刷一次，双击连续使用；点击目标段落应用">▧ 格式刷</button><button id="findBtn">查找</button><button id="replaceBtn">替换</button><button id="linkBtn">链接</button><span class="divider"></span><button id="imageBtn">＋ 图片</button><button id="restoreWindowBtn">↗ 恢复窗口</button><button id="tableBtn">▦ 表格</button></div><div class="view-actions"><button id="zoomMinus" aria-label="缩小正文">−</button><button id="zoomValue" title="恢复到 100%">100%</button><button id="zoomPlus" aria-label="放大正文">＋</button><button id="colorsBtn" title="选择主题方案" aria-label="选择主题方案" aria-haspopup="dialog">主题 ▾</button></div></div>
<div id="tableTools" class="table-tools" hidden><span>表格编辑</span><button data-table="addRowAfter">＋ 行</button><button data-table="addColumnAfter">＋ 列</button><button data-table="deleteRow">删除行</button><button data-table="deleteColumn">删除列</button><button data-table="toggleHeaderRow">表头</button><button data-table="deleteTable">删除表格</button><span class="table-tip">点击单元格直接输入 · Tab 切换单元格</span></div>
<div class="document-workspace"><aside id="documentOutline" aria-label="目录"><div class="outline-heading"><strong>目录</strong><span id="outlineCount"></span><button id="closeOutline" title="收起目录" aria-label="收起目录">‹</button></div><div class="nav-tabs"><button id="tocTab" class="active">目录</button><button id="searchTab">查找</button><button id="replaceTab">替换</button></div><section id="searchPanel" hidden><input id="findText" placeholder="查找文字" aria-label="查找文字"><label class="check-label"><input id="matchCase" type="checkbox">区分大小写</label><label class="check-label"><input id="wholeWord" type="checkbox">全字匹配</label><div class="search-actions"><button id="findPrev">上一处</button><button id="findNext">下一处</button></div><div id="findStatus" role="status"></div><div id="replacePanel" hidden><input id="replaceText" placeholder="替换为" aria-label="替换为"><div class="search-actions"><button id="replaceOne">替换</button><button id="replaceAll">全部替换</button></div></div><div id="searchResults"></div></section><nav id="outlineList" aria-label="按标题浏览"></nav><p id="outlineEmpty">暂无标题<br>选中文字，将“正文”改为标题，即可在这里快速定位。</p></aside><div id="documentScroll"><div class="page-caption">像写文档一样，自在记录。<span>直接编辑 · 本地保存</span></div><div id="editor"></div><div class="page-bottom">拖入图片，或用上方工具栏添加表格</div></div>
</div><div id="imageToolbar" class="image-toolbar" hidden><span>图片宽度</span><button id="imageSmaller">−</button><input id="imageWidth" type="number" min="24" max="8192" aria-label="图片宽度"><span>px</span><button id="imageLarger">＋</button><button id="imageNatural">原始大小</button><button id="viewImage" class="primary">放大查看 ↗</button><button id="deleteImage">删除图片</button></div>
<footer><div><span class="status-dot"></span><span id="status">直接在页面里输入文字</span></div><div><span id="wordCount">0 字</span><span id="encodingLabel">UTF-8</span><span>本地文档</span></div></footer></main>
<div id="toast" role="status" hidden></div>
<dialog id="schemesDialog" class="small-dialog schemes-dialog"><form method="dialog"><h2>主题方案</h2><p>选择喜欢的主题，下次打开自动沿用。</p><div id="schemeList"></div><div class="dialog-actions"><button id="newScheme" type="button">＋ 自定义方案</button><button class="primary">完成</button></div></form></dialog><dialog id="colorsDialog" class="small-dialog colors-dialog"><form method="dialog"><h2>自定义主题</h2><p>修改即时预览并自动保存，随时可以切换回来。</p><label for="schemeName">方案名称</label><input id="schemeName" maxlength="32" autocomplete="off"><div class="color-row"><label for="color-accent">主题色<small>按钮与选中效果</small></label><input id="color-accent" type="color" aria-label="主题色"><input id="hex-accent" class="hex-color" aria-label="主题色十六进制" maxlength="7" spellcheck="false"></div><div class="color-row"><label for="color-background">背景色<small>玻璃背后的底色</small></label><input id="color-background" type="color" aria-label="背景色"><input id="hex-background" class="hex-color" aria-label="背景色十六进制" maxlength="7" spellcheck="false"></div><div class="color-row"><label for="color-paper">文档底色<small>书写页面的颜色</small></label><input id="color-paper" type="color" aria-label="文档底色"><input id="hex-paper" class="hex-color" aria-label="文档底色十六进制" maxlength="7" spellcheck="false"></div><div class="color-row"><label for="color-text">正文颜色<small>文档中的文字</small></label><input id="color-text" type="color" aria-label="正文颜色"><input id="hex-text" class="hex-color" aria-label="正文颜色十六进制" maxlength="7" spellcheck="false"></div><section class="theme-effects"><h3>背景与玻璃</h3><label>背景类型<select id="backgroundType"><option value="solid">纯色</option><option value="gradient">渐变色</option><option value="image">上传图片</option></select></label><div id="gradientControls"><label>渐变终点<input id="gradientEnd" type="color" value="#b9d5ff"></label><label>渐变角度<input id="gradientAngle" type="range" min="0" max="360" value="135"><output></output></label></div><div id="imageControls"><button id="uploadThemeImage" type="button">上传背景图片</button><img id="themeThumbnail" alt="主题图片缩略图" hidden><label>图片缩放<input id="themeScale" type="range" min="100" max="250" value="100"><output></output></label></div><label>背景透明度<input id="themeOpacity" type="range" min="0" max="100" value="100"><output></output></label><label>背景模糊度<input id="themeBlur" type="range" min="0" max="40" value="0"><output></output></label><label class="check-label"><input id="themeGlass" type="checkbox" checked>液态玻璃效果</label><label>玻璃透明度<input id="glassOpacity" type="range" min="10" max="100" value="66"><output></output></label><label>玻璃模糊度<input id="glassBlur" type="range" min="0" max="50" value="24"><output></output></label></section><div id="colorError" role="status"></div><div class="dialog-actions"><button id="resetColors" type="button">恢复默认</button><button id="applyColors" type="button" class="primary">完成</button></div></form></dialog>
<div id="highlightMenu" class="tool-popover" hidden><div id="highlightPalette"></div><button id="clearHighlight" type="button">清除突出</button></div><div id="numberMenu" class="tool-popover" hidden></div>


<dialog id="tableDialog" class="small-dialog"><form method="dialog"><h2>插入表格</h2><p>创建后，点击单元格就能输入内容。</p><div class="table-dimensions"><label>行数<input id="tableRows" type="number" value="3" min="1" max="50"></label><label>列数<input id="tableCols" type="number" value="3" min="1" max="20"></label></div><label class="check-label"><input id="tableHeader" type="checkbox" checked>第一行作为表头</label><div class="dialog-actions"><button value="cancel">取消</button><button id="insertTable" type="button" class="primary">插入表格</button></div></form></dialog>
<dialog id="linkDialog" class="small-dialog"><form method="dialog"><h2>插入链接</h2><label>网址<input id="linkUrl" type="url" placeholder="https://"></label><div class="dialog-actions"><button value="cancel">取消</button><button id="applyLink" type="button" class="primary">应用</button></div></form></dialog>
<dialog id="lightbox"><div class="lightbox-header"><span id="imageName">图片预览</span><div><button id="viewerMinus">−</button><button id="viewerPercent">100%</button><button id="viewerPlus">＋</button><button id="viewerFit">适应窗口</button><button id="viewerOriginal">1:1 原图</button><button id="viewerClose">×</button></div></div><div id="imageStage"><img id="largeImage" draggable="false" alt="图片预览"></div><div class="lightbox-hint">滚轮缩放 · 拖动平移 · Esc 关闭</div></dialog>
<script src="renderer.js"></script></body></html>
